name: CTI verisini güncelle ve yayınla

on:
  schedule:
    - cron: "17 */4 * * *"     # her 4 saatte bir (UTC)
  workflow_dispatch:            # Actions sekmesinden elle çalıştırma
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "feeds/**"
      - "README.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cti-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tehdit kaynaklarını topla
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
          RANSOMWARELIVE_KEY: ${{ secrets.RANSOMWARELIVE_KEY }}
        run: python scripts/fetch_feeds.py

      - name: Veriyi depoya işle (geçmiş ve yedek için)
        run: |
          git config user.name  "cti-bot"
          git config user.email "cti-bot@users.noreply.github.com"
          git add data feeds
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "CTI verisi güncellendi: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
